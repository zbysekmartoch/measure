<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;background:#f3f4f6;color:#111827}
#topbar{height:44px;flex-shrink:0;background:#111827;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
#filename{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#mode{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:#1f2937;color:#93c5fd;border:1px solid #374151}
#mode.view{color:#86efac}
#editor-shell{position:relative;flex:1;min-height:0}
#editor{width:100%;height:100%}
#loading,#error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#f9fafb;padding:24px}
#error{display:none;text-align:center}
#error h2{font-size:16px;color:#b91c1c}
#error pre{max-width:900px;white-space:pre-wrap;font-size:12px;line-height:1.5;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;color:#374151}
.spinner{width:36px;height:36px;border:3px solid #d1d5db;border-top-color:#2563eb;border-radius:999px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="topbar">
    <a href="/" style="color:#9ca3af;text-decoration:none;font-size:13px">Measure</a>
    <span style="color:#4b5563">|</span>
    <div id="filename">Loading document...</div>
    <div id="mode">EDIT</div>
  </div>

  <div id="editor-shell">
    <div id="loading">
      <div class="spinner"></div>
      <div style="font-size:13px;color:#6b7280">Loading Office editor...</div>
    </div>
    <div id="error">
      <h2>Unable to load Office editor</h2>
      <pre id="error-detail"></pre>
    </div>
    <div id="editor"></div>
  </div>

<script>
const qs = new URLSearchParams(window.location.search);
const apiBasePath = qs.get('apiBasePath');
const filePath = qs.get('file');
const mode = qs.get('mode') === 'view' ? 'view' : 'edit';
const embed = qs.get('embed') === '1';

const filenameEl = document.getElementById('filename');
const modeEl = document.getElementById('mode');
modeEl.textContent = mode === 'view' ? 'VIEW' : 'EDIT';
if (mode === 'view') modeEl.classList.add('view');

if (embed) {
  document.body.style.background = '#fff';
  document.getElementById('topbar').style.display = 'none';
}

if (!apiBasePath || !filePath) {
  showError('Missing required query parameters: apiBasePath and file.');
} else {
  const fileName = filePath.split('/').pop() || filePath;
  filenameEl.textContent = fileName;
  document.title = `${fileName} - ${mode === 'view' ? 'Preview' : 'Editor'}`;
  boot();
}

async function boot() {
  try {
    const { docServerUrl, config } = await loadEditorConfig();
    await loadDocumentServerApi(docServerUrl);

    if (!window.DocsAPI || typeof window.DocsAPI.DocEditor !== 'function') {
      throw new Error('DocsAPI is unavailable after loading api.js.');
    }

    hideLoading();
    window.docEditor = new window.DocsAPI.DocEditor('editor', config);
  } catch (e) {
    showError(e.message || String(e));
  }
}

async function loadEditorConfig() {
  const authToken = localStorage.getItem('authToken');
  if (!authToken) {
    throw new Error('Missing auth token. Please log in again.');
  }

  const url = `${apiBasePath}/office/editor-config?file=${encodeURIComponent(filePath)}&mode=${mode}`;
  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${authToken}`,
    },
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error || `HTTP ${res.status} while loading editor config.`);
  }

  if (!data.docServerUrl || !data.config) {
    throw new Error('Backend returned incomplete office editor config payload.');
  }

  return data;
}

function loadDocumentServerApi(docServerUrl) {
  return new Promise((resolve, reject) => {
    const base = String(docServerUrl || '').replace(/\/+$/, '');
    if (!base) {
      reject(new Error('Document server URL is missing.'));
      return;
    }

    const script = document.createElement('script');
    script.src = `${base}/web-apps/apps/api/documents/api.js`;
    script.async = true;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error(`Cannot load Document Server API from ${script.src}`));
    document.head.appendChild(script);
  });
}

function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function showError(message) {
  hideLoading();
  const err = document.getElementById('error');
  err.style.display = 'flex';
  document.getElementById('error-detail').textContent = message;
}
</script>
</body>
</html>
